<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Therapists - PhysioCare</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <div class="page-header">
        <h1>All Therapists</h1>
        <p>Choose the right expert for your recovery</p>
    </div>

    <!-- SECTION -->
    <div class="therapist-section">

        <!-- 🔍 Search -->
        <div class="search-bar">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by name or specialization...">
            </div>
        </div>

        <!-- ✅ Dynamic container -->
        <div class="therapist-grid" id="therapistContainer"></div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
